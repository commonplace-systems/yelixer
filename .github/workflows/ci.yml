name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          elixir-version: "1.18.4"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: test/fixtures/package-lock.json

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      # Formatting. This step did not exist until 2026-08-27, which is how
      # 26 committed files drifted unformatted without anything saying so --
      # discovered because bin/land-round.sh runs this check and correctly
      # refused to land. The gate and the pass that made it green land in the
      # same commit deliberately: a format pass without the check re-rots.
      - name: Check formatting
        run: mix format --check-formatted

      # PROPERTY 1 of 3 — BOUNDARY. yelixer must not reference its former
      # parent application. This was an umbrella-era invariant that only
      # became checkable-in-isolation when the library was extracted; nothing
      # else verifies it now that commonplace no longer contains the app.
      - name: Enforce Commonplace boundary
        run: elixir test/support/check_commonplace_refs.exs .

      # PROPERTY 2 of 3 — SELF-CONTAINMENT. A fresh checkout must resolve,
      # compile and run its own suite with no parent repository present.
      # `actions/checkout` gives exactly that: this job IS the standalone
      # position that commonplace's umbrella used to hide.
      #
      # Wrapped in yx-test-guard because `mix test` exits 0 when it selects
      # NOTHING — assert the COUNT, never an exit code.
      # Floor 380 -> 395 -> 405, each step deliberate: +4 doc-spec pins, +1
      # doctest term the old arithmetic dropped, +10 parity CONTROLS that now
      # run here rather than hiding in the excluded population (see below).
      # Only the 7 expected-red :divergence arms are excluded here; they are
      # counted in their own job.
      #
      # The guard compares this floor against EXECUTED tests, not DEFINED ones:
      # ExUnit's "N tests" counts every test in the loaded files INCLUDING the
      # excluded ones, so a floor checked against it can be satisfied by tests
      # that never ran. Executed = (tests + doctests) - excluded - skipped;
      # "N doctests, M tests" are DISJOINT and "excluded" spans both.
      - name: Run the suite (count-asserted)
        run: bin/yx-test-guard --min 405 -- mix test

      # PROPERTY 3 of 3 — WIRE CONFORMANCE WITH YJS ITSELF. This is the
      # property the library exists to have, and between the extraction and
      # this workflow it was verified NOWHERE: the umbrella deleted its
      # conformance matrix along with the app it targeted, correctly, because
      # the target was gone.
      #
      # ⛔ Both oracles are REQUIRED, and a missing oracle must be RED, never
      # skipped: the suite skips itself when the Yjs driver is absent, which is
      # right locally and a silent hole in CI. YELIXER_REQUIRE_YJS_ORACLE=1
      # turns that skip into a raise, and --exact 11 is the second line of
      # defence if the flag is ever dropped.
      - name: Install the Yjs oracles
        run: npm ci --prefix test/fixtures

      - name: Conformance vs Yjs stable (13.6.32)
        env:
          YJS_ORACLE: stable
          YELIXER_REQUIRE_YJS_ORACLE: "1"
        run: bin/yx-test-guard --exact 11 -- mix test test/yelixer/diff_yjs_test.exs --include diff_yjs

      # Preview tracks the v14 prerelease line. It is reported separately so a
      # preview-only regression is visible as itself rather than being averaged
      # into the stable verdict.
      - name: Conformance vs Yjs preview (14.0.0-16)
        env:
          YJS_ORACLE: preview
          YELIXER_REQUIRE_YJS_ORACLE: "1"
        run: bin/yx-test-guard --exact 11 -- mix test test/yelixer/diff_yjs_test.exs --include diff_yjs

      # THE DIVERGENCE POPULATION — RED BY DESIGN, AND COUNTED.
      #
      # These pin MEASURED yelixer/yjs parity bugs that are not yet fixed, so
      # their correct state is red. They are excluded from the default suite
      # (test/test_helper.exs) and from the --exact 11 conformance population
      # deliberately: a gate that is red for known-and-accepted reasons stops
      # being a gate, which is the exact defect this job exists to measure.
      #
      # ⭐ --expect-failures is not "ignore failures". It fails in BOTH
      # directions. Fewer reds means either a divergence was fixed (restate the
      # count, and say which case retired) or a case stopped being able to fail
      # — a vacuous arm, which is worse than a red one because it looks exactly
      # like coverage in a count. More reds means a new divergence or a
      # regression.
      #
      # Four populations, four failure modes, all from one root cause at
      # lib/yelixer/item.ex:266 (graphemes minted where yjs mints UTF-16 units):
      #   LOST / SILENTLY TRUNCATED — reused client_id, follows the author's clock
      #   CORRUPTED (U+FFFD)        — follows the origin reference; survives a fresh id
      #   UNDER-DELETED             — delete-set names the deleted item's client
      #   MISPLACED on READ         — the integrating side counts graphemes too,
      #                               so a minting-only fix would not close it
      # TWO LABELS, TWO FACTS. :parity = "member of the parity table" (NOT
      # excluded); :divergence = "expected red" (excluded from the default
      # suite). The 10 controls carry :parity ALONE, so they run in the
      # ordinary suite above and a broken control turns THAT red -- verified
      # by mutation. Tagging them :divergence would have parked the table's
      # own vacuity guards in the excluded population, where a silent break
      # leaves the default run green while the table keeps printing its reds
      # -- indistinguishable from a harness that ALWAYS reports divergence.
      - name: Divergence pins vs Yjs stable (RED BY DESIGN, counted)
        env:
          YJS_ORACLE: stable
          YELIXER_REQUIRE_YJS_ORACLE: "1"
        run: bin/yx-test-guard --exact 17 --expect-failures 7 -- mix test test/yelixer/divergence_clock_test.exs --include divergence
